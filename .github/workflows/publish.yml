name: Publish

# `nx release version` commits the new versions on main and tags each project `release/<name>/<version>`;
# a push to main then publishes every package whose version on main is tagged and not yet on npm. So a
# failed or skipped release goes out with the next push or a manual run, and a published one never twice.
# Push release commits and their tags together (`git push --atomic origin main --follow-tags`) and
# straight to main: a rebased or squashed copy of a release commit leaves its tags behind.
on:
  push:
    branches: [main]
    paths: ['packages/*/package.json']
  workflow_dispatch:

jobs:
  released:
    name: Find released packages
    runs-on: ubuntu-latest
    outputs:
      all: ${{ steps.tags.outputs.all }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read unpublished release tags
        id: tags
        run: |
          all=()
          for manifest in packages/*/package.json; do
            read -r name version private < <(node -p "const m = require('./$manifest'); [m.name, m.version, !!m.private].join(' ')")
            [[ "$private" == true ]] && continue
            git rev-parse -q --verify "refs/tags/release/$name/$version" >/dev/null || continue
            [[ -n "$(npm view "$name@$version" version --registry https://registry.npmjs.org 2>/dev/null)" ]] && continue
            all+=("$name")
          done
          echo "all=$(IFS=,; echo "${all[*]}")" >> "$GITHUB_OUTPUT"
          echo "to publish: ${all[*]:-none}"

  publish:
    name: Publish
    needs: released
    if: needs.released.outputs.all != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          # no `registry-url`: it writes a placeholder NODE_AUTH_TOKEN that npm sends instead of OIDC

      # trusted publishing (OIDC, no token) needs npm 11.5.1 or later
      - name: Update npm
        run: npm install -g npm@^11.5.1 && npm --version

      - name: Install dependencies
        run: npm ci

      # the tarball ships `dist`, built here; each package is installed from its tarball into a
      # clean project and checked there (types, run, tree shaking) first
      - name: Build and check packages
        run: npx nx run-many -t build consumer --projects "$ALL"
        env:
          ALL: ${{ needs.released.outputs.all }}

      # npm trusts this workflow (`npm trust github <package> --file publish.yml`) and adds provenance itself
      - name: Publish packages
        run: npx nx release publish --projects "$ALL" --tag latest --verbose
        env:
          ALL: ${{ needs.released.outputs.all }}
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
          NPM_CONFIG_PROVENANCE: true
