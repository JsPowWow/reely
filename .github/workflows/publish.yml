name: Publish

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Run in dry-run mode (no actual publishing)'
        required: false
        default: false
        type: boolean
      projects:
        description: 'Projects to publish, comma separated'
        required: true
        default: '@reely/dommy'
        type: string
      dist-tag:
        description: 'npm dist-tag: next for a pre-release, latest for a release'
        required: true
        default: 'next'
        type: string

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # no `registry-url`: it writes a placeholder NODE_AUTH_TOKEN that npm sends instead of OIDC

      # trusted publishing (OIDC, no token) needs npm 11.5.1 or later
      - name: Update npm
        run: npm install -g npm@^11.5.1 && npm --version

      - name: Install dependencies
        run: npm install

      # the tarball ships `dist`, built here; a package with a `consumer` target is installed from
      # its tarball into a clean project and checked there (types, run, tree shaking) first
      - name: Build and check packages
        run: npx nx run-many -t build consumer --projects "$PROJECTS"
        env:
          PROJECTS: ${{ inputs.projects }}

      - name: Publish packages
        run: npx nx release publish --projects "$PROJECTS" --tag "$DIST_TAG" ${{ inputs.dry-run == true && '--dry-run --verbose' || '--verbose' }}
        env:
          PROJECTS: ${{ inputs.projects }}
          DIST_TAG: ${{ inputs.dist-tag }}
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
          # npm trusts this workflow (npmjs.com → package settings → Trusted Publisher) and adds provenance itself
          NPM_CONFIG_PROVENANCE: true
