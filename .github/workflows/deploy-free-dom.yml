name: Deploy free-dom

# Publishes the reely course (apps/free-dom) to https://reely-free-dom.netlify.app
on:
  push:
    branches: [main]
    paths:
      - 'apps/free-dom/**'
      - 'packages/**'
      - 'package-lock.json'
  workflow_dispatch:

concurrency:
  group: deploy-free-dom
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Netlify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx nx build free-dom

      - name: Deploy
        # netlify.toml of the app holds the SPA redirect
        working-directory: apps/free-dom
        run: >-
          npx --yes netlify-cli@27.10.1 deploy --prod --no-build
          --dir "$GITHUB_WORKSPACE/apps/free-dom/dist"
          --site "$NETLIFY_SITE_ID"
          --message "$GITHUB_SHA"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
