name: Publish

# `nx release version` commits the new versions on main and tags each project `release/<name>/<version>`;
# pushing those commits to main publishes every package tagged in the push. Push the commits and their
# tags together (`git push --atomic origin main --follow-tags`) and straight to main: a rebased or
# squashed copy of a release commit leaves its tags behind. A failed run is safe to re-run: a version
# already on npm is skipped.
on:
  push:
    branches: [main]
    paths: ['packages/*/package.json']

jobs:
  released:
    name: Find released packages
    runs-on: ubuntu-latest
    outputs:
      all: ${{ steps.tags.outputs.all }}
      latest: ${{ steps.tags.outputs.latest }}
      next: ${{ steps.tags.outputs.next }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # the tags on the pushed commits; a pre-release version (`0.1.0-next.3`) goes to `next`, any other to `latest`
      - name: Read release tags
        id: tags
        run: |
          latest=()
          next=()
          for tag in $(git tag --list 'release/@reely/*' --merged "$AFTER" --no-merged "$BEFORE"); do
            release="${tag#release/}"
            if [[ "${release##*/}" == *-* ]]; then next+=("${release%/*}"); else latest+=("${release%/*}"); fi
          done
          all=("${latest[@]}" "${next[@]}")
          echo "latest=$(IFS=,; echo "${latest[*]}")" >> "$GITHUB_OUTPUT"
          echo "next=$(IFS=,; echo "${next[*]}")" >> "$GITHUB_OUTPUT"
          echo "all=$(IFS=,; echo "${all[*]}")" >> "$GITHUB_OUTPUT"
          echo "released: ${all[*]:-none}"
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}

  publish:
    name: Publish
    needs: released
    if: needs.released.outputs.all != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # no `registry-url`: it writes a placeholder NODE_AUTH_TOKEN that npm sends instead of OIDC

      # trusted publishing (OIDC, no token) needs npm 11.5.1 or later
      - name: Update npm
        run: npm install -g npm@^11.5.1 && npm --version

      - name: Install dependencies
        run: npm install

      # the tarball ships `dist`, built here; each package is installed from its tarball into a
      # clean project and checked there (types, run, tree shaking) first
      - name: Build and check packages
        run: npx nx run-many -t build consumer --projects "$ALL"
        env:
          ALL: ${{ needs.released.outputs.all }}

      # npm trusts this workflow (`npm trust github <package> --file publish.yml`) and adds provenance itself
      - name: Publish packages
        run: |
          if [[ -n "$LATEST" ]]; then npx nx release publish --projects "$LATEST" --tag latest --verbose; fi
          if [[ -n "$NEXT" ]]; then npx nx release publish --projects "$NEXT" --tag next --verbose; fi
        env:
          LATEST: ${{ needs.released.outputs.latest }}
          NEXT: ${{ needs.released.outputs.next }}
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
          NPM_CONFIG_PROVENANCE: true
