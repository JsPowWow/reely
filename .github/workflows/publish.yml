name: Publish

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Run in dry-run mode (no actual publishing)'
        required: false
        default: false
        type: boolean
      projects:
        description: 'Projects to publish, comma separated'
        required: true
        default: '@reely/dommy'
        type: string
      dist-tag:
        description: 'npm dist-tag: next for a pre-release, latest for a release'
        required: true
        default: 'next'
        type: string

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm install

      # `nx release publish` does not run the build: without this step the tarball has no `dist`
      - name: Build packages
        run: npx nx run-many -t build --projects "$PROJECTS"
        env:
          PROJECTS: ${{ inputs.projects }}

      - name: Publish packages
        run: |
          git config --global user.email "js.developer.powwow@gmail.com"
          git config --global user.name "JsPowWow"
          npx nx release publish --projects "$PROJECTS" --tag "$DIST_TAG" ${{ inputs.dry-run == true && '--dry-run --verbose' || '--verbose' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
          PROJECTS: ${{ inputs.projects }}
          DIST_TAG: ${{ inputs.dist-tag }}
          NPM_CONFIG_PROVENANCE: true
